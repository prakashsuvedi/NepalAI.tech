name: Direct Deploy to cPanel (via API Token)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via cPanel API Token
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --no-audit --no-fund

      - name: 🔨 Build Production Assets (Vite)
        run: npm run build

      - name: 🗜️ Package dist into deploy.zip
        run: |
          cd dist
          zip -r -q ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: 🚀 Deploy to cPanel via UAPI Token
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DEPLOY_DIR: ${{ secrets.CPANEL_DEPLOY_DIR || 'nepalai.tech' }}
        run: |
          echo "🌐 Connecting to cPanel at https://$CPANEL_HOST:2083 ..."
          echo "🎯 Target deployment directory: $CPANEL_DEPLOY_DIR"
          
          # 1. Upload deploy.zip to cPanel using UAPI Fileman
          echo "📤 Uploading build archive to $CPANEL_DEPLOY_DIR..."
          UPLOAD_RES=$(curl -s -k \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            -F "dir=$CPANEL_DEPLOY_DIR" \
            -F "overwrite=1" \
            -F "file-1=@deploy.zip;filename=deploy.zip" \
            "https://$CPANEL_HOST:2083/execute/Fileman/upload_files")
          
          echo "Upload Response: $UPLOAD_RES"
          
          # Check status
          if [[ "$UPLOAD_RES" =~ '"status":1' || "$UPLOAD_RES" =~ '"status": 1' ]]; then
            echo "✅ Archive uploaded successfully."
          else
            echo "❌ Upload failed. Please verify CPANEL_HOST, CPANEL_USER and CPANEL_API_TOKEN."
            exit 1
          fi

          # 2. Extract deploy.zip inside target directory automatically
          echo "📂 Extracting archive into $CPANEL_DEPLOY_DIR..."
          EXTRACT_RES=$(curl -s -k \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --data-urlencode "dir=$CPANEL_DEPLOY_DIR" \
            --data-urlencode "file=deploy.zip" \
            --data-urlencode "dest=$CPANEL_DEPLOY_DIR" \
            --data-urlencode "overwrite=1" \
            "https://$CPANEL_HOST:2083/execute/Fileman/extract_archive")
          
          echo "Extract Response: $EXTRACT_RES"

          # Fallback extraction check
          if [[ ! "$EXTRACT_RES" =~ '"status":1' && ! "$EXTRACT_RES" =~ '"status": 1' ]]; then
            echo "⚠️ Primary extract returned notice, trying secondary UAPI extract_files..."
            curl -s -k \
              -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
              --data-urlencode "dir=$CPANEL_DEPLOY_DIR" \
              --data-urlencode "files=deploy.zip" \
              "https://$CPANEL_HOST:2083/execute/Fileman/extract_files"
          fi

          # 3. Clean up the zip file on server (delete deploy.zip)
          echo "🧹 Automatically removing deploy.zip from server..."
          # Try delete_files UAPI
          curl -s -k \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --data-urlencode "files[0]=$CPANEL_DEPLOY_DIR/deploy.zip" \
            "https://$CPANEL_HOST:2083/execute/Fileman/delete_files" > /dev/null || true
          
          # Try fileop unlink as fallback
          curl -s -k \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            "https://$CPANEL_HOST:2083/execute/Fileman/fileop?op=unlink&sourcefiles=$CPANEL_DEPLOY_DIR%2Fdeploy.zip" > /dev/null || true

          echo "🎉 Deployment to cPanel completed and updated automatically!"
