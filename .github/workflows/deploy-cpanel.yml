name: Direct Deploy to cPanel (via API Token)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via cPanel API Token
    runs-on: ubuntu-latest
    env:
      USE_FTP_DEPLOY: ${{ secrets.FTP_SERVER != '' }}

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install --no-audit --no-fund

      - name: 🔨 Build Production Assets (Vite)
        run: npm run build

      - name: 🗜️ Package dist into deploy.zip
        run: |
          cd dist
          zip -r -q ../deploy.zip .
          cd ..
          ls -lh deploy.zip

      - name: 🔧 Normalize FTP target directory
        if: env.USE_FTP_DEPLOY == 'true'
        env:
          RAW_FTP_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          DIR=$(echo "$RAW_FTP_DIR" | xargs)
          if [[ -z "$DIR" ]]; then
            DIR="public_html/"
          elif [[ "$DIR" != */ ]]; then
            DIR="${DIR}/"
          fi
          echo "NORMALIZED_FTP_DIR=$DIR" >> "$GITHUB_ENV"

      - name: 🚀 Deploy to cPanel via FTPS / FTP (Fail-safe Direct Sync)
        if: env.USE_FTP_DEPLOY == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ env.NORMALIZED_FTP_DIR }}
          local-dir: ./dist/

      - name: 🚀 Deploy to cPanel via UAPI Token
        if: env.USE_FTP_DEPLOY != 'true'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DEPLOY_DIR: ${{ secrets.CPANEL_DEPLOY_DIR || 'public_html' }}
        run: |
          echo "=========================================================="
          echo "🚀 NepalAI Sovereign Platform — cPanel CI/CD Pipeline"
          echo "=========================================================="

          # Clean and sanitize inputs
          CLEAN_HOST=$(echo "$CPANEL_HOST" | sed -E 's|^https?://||' | sed -E 's|:.*||' | sed -E 's|/.*||' | xargs)
          CLEAN_USER=$(echo "$CPANEL_USER" | xargs)
          CLEAN_TOKEN=$(echo "$CPANEL_API_TOKEN" | xargs)

          # cPanel Fileman expects a path relative to /home/<user>/ (e.g. 'public_html' or 'nepalai.tech').
          # Strip any '/home/<user>/' prefix if the secret was pasted as an absolute path.
          CLEAN_DIR=$(echo "$CPANEL_DEPLOY_DIR" | xargs | sed -E 's|^/?home/[^/]+/?||' | sed -E 's|^/+||' | sed -E 's|/+$||')
          if [[ -z "$CLEAN_DIR" ]]; then
            CLEAN_DIR="public_html"
          fi

          if [[ -z "$CLEAN_HOST" || -z "$CLEAN_USER" || -z "$CLEAN_TOKEN" ]]; then
            echo "❌ Missing required GitHub Secrets: CPANEL_HOST, CPANEL_USER, and CPANEL_API_TOKEN must all be set (or configure FTP_SERVER/FTP_USERNAME/FTP_PASSWORD)."
            exit 1
          fi

          echo "🌐 Host: $CLEAN_HOST (Port: 2083)"
          echo "👤 cPanel User: $CLEAN_USER"
          echo "🎯 Target Directory (relative to home): $CLEAN_DIR"

          # 0. Pre-flight API Token verification
          AUTH_CODE=$(curl -s -k -o /tmp/preflight.json -w "%{http_code}" \
            -H "Authorization: cpanel $CLEAN_USER:$CLEAN_TOKEN" \
            "https://$CLEAN_HOST:2083/execute/DomainInfo/list_domains")
          AUTH_RES=$(cat /tmp/preflight.json 2>/dev/null || echo "Empty response")

          if [[ "$AUTH_CODE" == "401" || "$AUTH_CODE" == "403" ]]; then
            echo "❌ cPanel rejected authentication on pre-flight check (HTTP $AUTH_CODE): $AUTH_RES"
            echo "   -> Verify CPANEL_USER is your cPanel Linux username (not email), CPANEL_HOST is the direct server hostname (not Cloudflare-proxied), and CPANEL_API_TOKEN has Full Permissions."
            echo "   -> Or switch to FTP deployment by adding secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR."
            exit 1
          fi

          # 1. Upload build archive to cPanel via UAPI Fileman::upload_files
          echo "📤 Uploading build archive (deploy.zip) to $CLEAN_DIR..."
          HTTP_CODE=$(curl -s -k -o /tmp/upload_response.json -w "%{http_code}" \
            -H "Authorization: cpanel $CLEAN_USER:$CLEAN_TOKEN" \
            -F "dir=$CLEAN_DIR" \
            -F "overwrite=1" \
            -F "file-1=@deploy.zip;filename=deploy.zip" \
            "https://$CLEAN_HOST:2083/execute/Fileman/upload_files")

          UPLOAD_RES=$(cat /tmp/upload_response.json 2>/dev/null || echo "Empty response")
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Upload Response: $UPLOAD_RES"

          if [[ "$UPLOAD_RES" =~ '"status":1' || "$UPLOAD_RES" =~ '"status": 1' ]]; then
            echo "✅ Archive uploaded successfully to $CLEAN_DIR."
          else
            echo "❌ Upload failed with response: $UPLOAD_RES (HTTP $HTTP_CODE)"
            echo ""
            echo "=========================================================="
            echo "🔍 HOW TO FIX HTTP $HTTP_CODE ($UPLOAD_RES):"
            echo "1. API TOKEN PERMISSIONS (Most Common):"
            echo "   - Go to cPanel -> Security -> Manage API Tokens."
            echo "   - Create a new token and ensure File Manager / All Privileges are enabled."
            echo "2. MODSECURITY / SHARED HOST BLOCKING ZIP UPLOAD VIA UAPI:"
            echo "   - Pre-flight auth returned HTTP $AUTH_CODE, so if pre-flight passed (200) and upload returned 403,"
            echo "     your host's WAF/ModSecurity or token ACL blocks UAPI Fileman::upload_files."
            echo "3. RECOMMENDED FIX — USE FTP/FTPS SECRETS INSTEAD (Already wired in this workflow):"
            echo "   - Add GitHub Repository Secrets:"
            echo "     * FTP_SERVER     = ftp.nepalai.tech (or your cPanel server hostname)"
            echo "     * FTP_USERNAME   = your cPanel FTP username"
            echo "     * FTP_PASSWORD   = your cPanel FTP password"
            echo "     * FTP_SERVER_DIR = nepalai.tech/  (or public_html/ for primary domain)"
            echo "=========================================================="
            exit 1
          fi

          # 2. Extract deploy.zip using cPanel API 2 Fileman::fileop (op=extract)
          echo "📂 Extracting deploy.zip inside $CLEAN_DIR..."
          EXTRACT_RES=$(curl -s -k -G \
            -H "Authorization: cpanel $CLEAN_USER:$CLEAN_TOKEN" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=extract" \
            --data-urlencode "sourcefiles=$CLEAN_DIR/deploy.zip" \
            --data-urlencode "destfiles=$CLEAN_DIR" \
            --data-urlencode "doubledecode=0" \
            "https://$CLEAN_HOST:2083/json-api/cpanel")

          echo "Extract Response: $EXTRACT_RES"
          if [[ "$EXTRACT_RES" =~ '"error"' ]]; then
            echo "❌ Archive extraction returned an error: $EXTRACT_RES"
            exit 1
          fi

          # 3. Clean up deploy.zip on server
          echo "🧹 Cleaning up deploy.zip on server..."
          curl -s -k -G \
            -H "Authorization: cpanel $CLEAN_USER:$CLEAN_TOKEN" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=unlink" \
            --data-urlencode "sourcefiles=$CLEAN_DIR/deploy.zip" \
            "https://$CLEAN_HOST:2083/json-api/cpanel" > /dev/null || true

          curl -s -k -G \
            -H "Authorization: cpanel $CLEAN_USER:$CLEAN_TOKEN" \
            --data-urlencode "dir=$CLEAN_DIR" \
            --data-urlencode "file=deploy.zip" \
            "https://$CLEAN_HOST:2083/execute/Fileman/delete_file" > /dev/null || true

          echo "🎉 Deployment to cPanel completed successfully!"
