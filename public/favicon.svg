<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Sovereign Emerald Gradient -->
    <linearGradient id="favEmeraldGrad" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Deep Tech Indigo Gradient -->
    <linearGradient id="favIndigoGrad" x1="16" y1="32" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Specular Highlight for Pure Minimalist Glass Look -->
    <linearGradient id="favSpecular" x1="18" y1="10" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Refined Squircle Border -->
    <linearGradient id="favSquircleBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Base Squircle with Metallic Accent -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A"/>
  <rect width="64" height="64" rx="16" stroke="url(#favSquircleBorder)" stroke-width="1.6"/>

  <!-- Left Flag Spine / N Pillar -->
  <rect x="13" y="10" width="8" height="44" rx="4" fill="url(#favEmeraldGrad)"/>

  <!-- Upper Himalayan Pennant / Diagonal Apex -->
  <path d="M22 13 L49 29 C50.5 30 50.5 32 49 33 L32 42.5 L22 36 V13 Z" fill="url(#favEmeraldGrad)"/>
  <path d="M22 13 L42 25 L22 36 V13 Z" fill="url(#favSpecular)"/>

  <!-- Lower Valley Apex / Interlocking Base -->
  <path d="M22 37.5 L33 44.5 L49 53.5 C50.5 54.5 49.8 55 48 55 H22 V37.5 Z" fill="url(#favIndigoGrad)"/>

  <!-- Pure White Intelligence Diamond Node -->
  <circle cx="31" cy="27" r="3" fill="#FFFFFF"/>
  <circle cx="45" cy="49" r="2.5" fill="#34D399"/>
</svg>
